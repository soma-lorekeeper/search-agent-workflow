# PR 검증. 배포는 하지 않으므로 AWS 권한이 전혀 필요 없다.
#
# 이 레포는 퍼블릭이라 포크 PR 이 올 수 있는데, OIDC 역할의 신뢰 정책이
# refs/heads/main 으로 좁혀져 있고 이 워크플로는 id-token 권한도 요청하지 않는다.
# 즉 PR 잡은 AWS 자격증명을 얻을 수단이 아예 없다.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python-mecab-ko 의 aarch64 휠이 cp312 까지만 있어 프로덕션도 3.12 를 쓴다.
      # 러너와 프로덕션 버전을 맞춰야 "여기선 되는데 저기선 안 되는" 문제를 피한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      # 임포트가 되는지까지 확인한다. 의존성만 깔리고 모듈이 깨져 있으면
      # 배포 후 기동 단계에서야 알게 되는데, 그때는 이미 늦다.
      - name: Import check
        env:
          # config.py 가 임포트 시점에 os.environ["OPENAI_API_KEY"] 를 읽는다.
          # 실제 호출은 하지 않으므로 자리표시자로 충분하다.
          OPENAI_API_KEY: sk-ci-placeholder
        run: python -c "import src.webapp; print('ok')"
