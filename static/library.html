<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>원고 목록 · 결</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --paper: #fbfaf7;
    --surface: #ffffff;
    --ink: #24211d;
    --ink-muted: #6b6355;
    --rule: #e7e2d6;
    --rule-strong: #d8d1c1;
    --mark-rose: #f2c9ce;
    --mark-sky: #c9dce6;
    --mark-sky-ink: #2c5266;
    --mark-sage: #cfe2c4;
    --mark-sage-ink: #3c5c30;
    --mark-butter: #f1e1a6;
    --accent: #8b3a46;
    --accent-ink: #ffffff;
    --font-display: "Noto Serif KR", serif;
    --font-body: "IBM Plex Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
  }
  a { color: inherit; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding: 22px 40px;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .glyph { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .wordmark .tagline { font-size: 12px; color: var(--ink-muted); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  nav a {
    text-decoration: none;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    color: var(--ink-muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav a:hover { color: var(--ink); background: var(--surface); }
  nav a.active { color: var(--ink); background: var(--surface); border: 1px solid var(--rule); }

  .top {
    max-width: 1080px;
    margin: 0 auto;
    padding: 44px 24px 0;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.35;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  .lede { font-size: 14.5px; color: var(--ink-muted); max-width: 46em; margin: 0 0 32px; }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 100px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    align-items: start;
  }

  .shelf {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    overflow: hidden;
  }
  .shelf-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 14px 16px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }
  .shelf-item:last-child { border-bottom: none; }
  .shelf-item:hover { background: #fdfbf9; }
  .shelf-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .shelf-item.active { background: #fff5f0; }
  .shelf-item.active .shelf-title { color: var(--accent); }
  .shelf-row1 { display: flex; align-items: center; gap: 8px; }
  .shelf-stamp {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 6px;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .shelf-title { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf-meta { font-size: 11px; color: var(--ink-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding-left: 2px; }
  .shelf-badge {
    display: inline-block;
    font-size: 10px;
    background: var(--mark-sage);
    color: var(--mark-sage-ink);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  .reader {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 36px 44px 44px;
    min-height: 480px;
  }
  .reader-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
  }
  .reader-stamp {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--mark-sky);
    color: var(--mark-sky-ink);
    border-radius: 6px;
    padding: 3px 8px;
  }
  .reader-info { font-size: 12px; color: var(--ink-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin-left: auto; }
  .reader h2 {
    font-family: var(--font-display);
    font-size: 24px;
    margin: 0 0 22px;
  }
  .reader-summary {
    background: #f2f7f9;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 26px;
    max-width: 62ch;
  }
  .reader-summary-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--mark-sky-ink);
    margin-bottom: 6px;
  }
  .reader-summary p { margin: 0; font-size: 13.5px; }
  .reader-body {
    font-size: 15.5px;
    line-height: 1.9;
    max-width: 62ch;
  }
  .reader-body p { margin: 0 0 1.1em; }
  .reader-note {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px dashed var(--rule);
    font-size: 12px;
    color: var(--ink-muted);
  }
  .shelf-summary {
    font-size: 11.5px;
    color: var(--ink-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-left: 2px;
  }
  .empty-state, .error-state {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 40px 30px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13.5px;
  }
  .empty-state a, .error-state a { color: var(--accent); text-decoration: underline; }

  @media (max-width: 760px) {
    header { padding: 18px 20px; }
    .top { padding: 36px 18px 0; }
    .layout { grid-template-columns: 1fr; padding: 0 18px 80px; }
    h1 { font-size: 25px; }
    .reader { padding: 26px 22px 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <span class="glyph">결</span>
    <span class="tagline">이야기의 결을 기억합니다</span>
  </div>
  <nav>
    <a href="/">원고 접수</a>
    <a href="/library" class="active">원고 목록</a>
    <a href="/report">정합성 리포트</a>
    <a href="/chat">Q&amp;A 챗봇</a>
  </nav>
</header>

<div class="top">
  <div class="eyebrow">03 · 원고 목록</div>
  <h1>지금까지 접수된 회차</h1>
  <p class="lede">
    접수된 회차를 선택하면 원문을 읽을 수 있습니다. 내용을 고치는 화면은 아니고,
    확인용 보기 전용입니다.
  </p>
</div>

<div class="layout">
  <div class="shelf" id="shelf"></div>
  <div class="reader" id="reader"></div>
</div>

<script>
  const shelfEl = document.getElementById("shelf");
  const readerEl = document.getElementById("reader");
  let episodes = [];
  let activeChapter = null;

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  function formatChars(n) {
    return n.toLocaleString("ko-KR") + "자";
  }

  function stamp(n) {
    return String(n).padStart(2, "0") + "화";
  }

  function renderShelf() {
    shelfEl.innerHTML = "";
    episodes.forEach((e) => {
      const btn = document.createElement("button");
      btn.className = "shelf-item" + (e.chapter === activeChapter ? " active" : "");
      btn.innerHTML = `
        <div class="shelf-row1">
          <span class="shelf-stamp">${stamp(e.chapter)}</span>
        </div>
        <div class="shelf-summary">${escapeHtml(e.summary)}</div>
        <div class="shelf-meta">${formatChars(e.chars)}<span class="shelf-badge">인덱싱 완료</span></div>
      `;
      btn.addEventListener("click", () => selectEpisode(e.chapter));
      shelfEl.appendChild(btn);
    });
  }

  function renderParagraphs(text) {
    const paras = text.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    return (paras.length ? paras : [text]).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  }

  async function selectEpisode(chapter) {
    activeChapter = chapter;
    renderShelf();
    readerEl.className = "reader";
    readerEl.innerHTML = `<p style="color:var(--ink-muted);font-size:13px;">불러오는 중...</p>`;
    try {
      const res = await fetch(`/api/episodes/${chapter}`);
      if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
      const e = await res.json();
      readerEl.innerHTML = `
        <div class="reader-meta">
          <span class="reader-stamp">${stamp(e.chapter)}</span>
          <span class="reader-info">${formatChars(e.chars)}</span>
        </div>
        <h2>${stamp(e.chapter)}</h2>
        <div class="reader-summary">
          <div class="reader-summary-label">요약</div>
          <p>${escapeHtml(e.summary) || "(요약 없음)"}</p>
        </div>
        <div class="reader-body">${renderParagraphs(e.raw_text)}</div>
      `;
    } catch (err) {
      readerEl.className = "error-state";
      readerEl.innerHTML = `${stamp(chapter)}를 불러오지 못했습니다: ${escapeHtml(err.message)}`;
    }
  }

  async function loadEpisodes() {
    shelfEl.innerHTML = `<div style="padding:16px;font-size:13px;color:var(--ink-muted);">불러오는 중...</div>`;
    try {
      const res = await fetch("/api/episodes");
      if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
      episodes = await res.json();
    } catch (err) {
      shelfEl.innerHTML = "";
      readerEl.className = "error-state";
      readerEl.innerHTML = `원고 목록을 불러오지 못했습니다: ${escapeHtml(err.message)}`;
      return;
    }

    if (episodes.length === 0) {
      shelfEl.innerHTML = "";
      readerEl.className = "empty-state";
      readerEl.innerHTML = `아직 접수된 회차가 없습니다. <a href="/">원고 접수</a> 페이지에서 먼저 회차를 올려주세요.`;
      return;
    }

    renderShelf();
    selectEpisode(episodes[0].chapter);
  }

  loadEpisodes();
</script>
</body>
</html>
