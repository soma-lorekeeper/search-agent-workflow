<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>검증 히스토리 · lorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --paper: #fbfaf7;
    --surface: #ffffff;
    --ink: #24211d;
    --ink-muted: #6b6355;
    --rule: #e7e2d6;
    --rule-strong: #d8d1c1;
    --mark-rose: #f2c9ce;
    --mark-rose-ink: #7a2c35;
    --mark-sage: #cfe2c4;
    --mark-sage-ink: #3c5c30;
    --mark-butter: #f1e1a6;
    --mark-butter-ink: #7a611b;
    --accent: #8b3a46;
    --accent-ink: #ffffff;
    --font-display: "Noto Serif KR", serif;
    --font-body: "IBM Plex Sans KR", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
  }
  a { color: inherit; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding: 22px 40px;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .glyph { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .wordmark .tagline { font-size: 12px; color: var(--ink-muted); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  nav a {
    text-decoration: none;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    color: var(--ink-muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav a:hover { color: var(--ink); background: var(--surface); }
  nav a.active { color: var(--ink); background: var(--surface); border: 1px solid var(--rule); }

  main { max-width: 820px; margin: 0 auto; padding: 56px 24px 120px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.35;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  .lede { font-size: 14.5px; color: var(--ink-muted); max-width: 46em; margin: 0 0 36px; }

  .list {
    border: 1px solid var(--rule);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 16px 20px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fdfbf9; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .row-main { flex: 1; min-width: 0; }
  .row-label {
    font-size: 14.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-time {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-muted);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .badges { display: flex; gap: 8px; flex-shrink: 0; }
  .badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    border-radius: 7px;
    padding: 4px 9px;
    white-space: nowrap;
  }
  .badge.flag { background: var(--mark-rose); color: var(--mark-rose-ink); }
  .badge.ok { background: var(--mark-sage); color: var(--mark-sage-ink); }
  .badge.unk { background: var(--mark-butter); color: var(--mark-butter-ink); }
  .badge.zero { opacity: 0.45; }

  .row-chev { font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); flex-shrink: 0; }

  .empty-state, .error-state {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 40px 30px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13.5px;
  }
  .empty-state a, .error-state a { color: var(--accent); text-decoration: underline; }

  @media (max-width: 620px) {
    header { padding: 18px 20px; }
    main { padding: 40px 18px 90px; }
    h1 { font-size: 25px; }
    .row { flex-wrap: wrap; }
    .badges { order: 3; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <span class="glyph">lorekeeper</span>
    <span class="tagline">이야기의 결을 기억합니다</span>
  </div>
  <nav>
    <a href="/">원고 접수</a>
    <a href="/library">원고 목록</a>
    <a href="/report">정합성 리포트</a>
    <a href="/reports" class="active">검증 히스토리</a>
    <a href="/chat">Q&amp;A 챗봇</a>
  </nav>
</header>

<main>
  <div class="eyebrow">04 · 검증 히스토리</div>
  <h1>지금까지 실행한 정합성 검사</h1>
  <p class="lede">
    이전에 어떤 파일을 검사했고, 결과가 어땠는지 다시 확인할 수 있습니다. 항목을 클릭하면
    그때의 리포트를 그대로 다시 볼 수 있어요.
  </p>

  <div id="listWrap"></div>
</main>

<script>
  const listWrap = document.getElementById("listWrap");

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
  }

  function formatTime(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString("ko-KR", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit",
    });
  }

  function badge(cls, n, label) {
    const zero = n === 0 ? " zero" : "";
    return `<span class="badge ${cls}${zero}">${label} ${n}</span>`;
  }

  function renderList(items) {
    if (!items.length) {
      listWrap.innerHTML = `
        <div class="empty-state">
          아직 검사 기록이 없습니다. <a href="/report">정합성 리포트</a> 페이지에서 먼저
          검사를 실행해보세요.
        </div>`;
      return;
    }

    const list = document.createElement("div");
    list.className = "list";
    items.forEach((item) => {
      const row = document.createElement("button");
      row.className = "row";
      const c = item.counts || {};
      row.innerHTML = `
        <div class="row-main">
          <div class="row-label">${escapeHtml(item.label)}</div>
          <div class="row-time">${formatTime(item.generated_at)} · 총 ${item.total}건</div>
        </div>
        <div class="badges">
          ${badge("flag", c.contradiction || 0, "모순")}
          ${badge("ok", c.consistent || 0, "일치")}
          ${badge("unk", c.unknown || 0, "확인불가")}
        </div>
        <span class="row-chev">▸</span>
      `;
      row.addEventListener("click", () => {
        window.location.href = `/report?label=${encodeURIComponent(item.label)}`;
      });
      list.appendChild(row);
    });
    listWrap.innerHTML = "";
    listWrap.appendChild(list);
  }

  async function loadHistory() {
    listWrap.innerHTML = `<div style="padding:16px;font-size:13px;color:var(--ink-muted);">불러오는 중...</div>`;
    try {
      const res = await fetch("/api/reports");
      if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
      const items = await res.json();
      renderList(items);
    } catch (err) {
      listWrap.innerHTML = `<div class="error-state">검증 히스토리를 불러오지 못했습니다: ${escapeHtml(err.message)}</div>`;
    }
  }

  loadHistory();
</script>
</body>
</html>
