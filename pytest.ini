[pytest]
# 저장소 루트를 import 경로에 넣는다.
#
# 테스트는 전부 `from src...`로 시작하는데, `pytest`를 그냥 부르면 sys.path에 들어가는
# 것은 테스트 파일이 있는 디렉터리(tests/)뿐이고 저장소 루트는 들어가지 않는다.
# `python -m pytest`는 현재 디렉터리를 넣어 주기 때문에 로컬에서는 우연히 통과했고,
# `pytest -q`로 도는 CI에서만 `ModuleNotFoundError: No module named 'src'`로 터졌다.
#
# 호출 방식에 따라 되고 안 되고가 갈리지 않도록 설정으로 못박는다. 경로는 이 파일이
# 있는 곳(rootdir) 기준이라 어느 디렉터리에서 실행해도 같다.
pythonpath = .
